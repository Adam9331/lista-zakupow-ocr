<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista Zakupów AI - GPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-6">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">
                    🤖 Lista Zakupów AI (GPT-4)
                </h1>
                <p class="text-gray-600">Inteligentne przetwarzanie przepisów z AI</p>
            </div>

            <div id="apiSetup" class="mb-6 p-4 bg-blue-50 border-2 border-blue-200 rounded-xl">
                <h3 class="font-bold text-blue-800 mb-3">🔑 Konfiguracja OpenAI API</h3>
                <p class="text-sm text-blue-700 mb-3">Potrzebujesz klucza API z OpenAI. <a href="https://platform.openai.com/api-keys" target="_blank" class="underline">Utwórz klucz tutaj</a></p>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="sk-..." 
                    class="w-full p-3 border-2 border-blue-300 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
                <button onclick="saveApiKey()" class="w-full bg-blue-500 text-white font-bold py-3 rounded-lg">
                    💾 Zapisz Klucz API
                </button>
            </div>

            <div class="mb-6">
                <label for="imageInput" id="uploadLabel" class="block w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-bold py-6 px-6 rounded-xl text-center cursor-pointer shadow-lg opacity-50">
                    <div class="text-4xl mb-2">📸</div>
                    <span id="uploadText">Wgraj Screenshot (Najpierw ustaw API Key)</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" class="hidden" disabled>
            </div>

            <button onclick="loadDemo()" class="w-full bg-gradient-to-r from-blue-400 to-cyan-500 text-white font-bold py-4 rounded-xl mb-6 shadow-lg">
                🍳 Załaduj Demo
            </button>

            <div id="progress" class="hidden mb-6 p-6 bg-gradient-to-r from-blue-50 to-indigo-50 border-2 border-blue-200 rounded-xl">
                <div class="flex flex-col items-center gap-4">
                    <div class="animate-spin rounded-full h-16 w-16 border-4 border-blue-600 border-t-transparent"></div>
                    <p id="progressText" class="text-blue-700 font-bold text-lg text-center"></p>
                </div>
            </div>

            <div id="error" class="hidden mb-6 p-4 bg-red-50 border-2 border-red-200 rounded-xl">
                <p class="text-red-700 font-bold">⚠️ Błąd</p>
                <p id="errorText" class="text-red-600 text-sm mt-2"></p>
            </div>

            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">📋 Przepisy (<span id="recipeCount">0</span>)</h2>
                <div id="recipesList" class="space-y-3"></div>
            </div>

            <button id="generateBtn" onclick="generateShoppingList()" disabled class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-4 rounded-xl mb-6 shadow-lg disabled:opacity-50">
                🛒 Wygeneruj Listę Zakupów
            </button>

            <div>
                <h2 class="text-2xl font-bold text-gray-800 mb-4">🛒 Lista Zakupów</h2>
                <div id="shoppingList" class="bg-gray-50 rounded-xl p-4 min-h-32">
                    <p class="text-center text-gray-400 py-8">Wybierz przepisy aby wygenerować listę</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let recipes = [];
        let selectedRecipes = new Set();
        let shoppingList = [];
        let apiKey = localStorage.getItem('openai_api_key') || '';

        // Initialize
        if (apiKey) {
            document.getElementById('apiKey').value = apiKey;
            document.getElementById('apiSetup').classList.add('hidden');
            enableUpload();
        }

        function enableUpload() {
            const input = document.getElementById('imageInput');
            const label = document.getElementById('uploadLabel');
            const text = document.getElementById('uploadText');
            
            input.disabled = false;
            label.classList.remove('opacity-50');
            label.classList.add('hover:opacity-90');
            text.textContent = '📸 Wgraj Screenshot Przepisu';
        }

        function saveApiKey() {
            apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey.startsWith('sk-')) {
                alert('Klucz API powinien zaczynać się od "sk-"');
                return;
            }
            localStorage.setItem('openai_api_key', apiKey);
            document.getElementById('apiSetup').classList.add('hidden');
            enableUpload();
            alert('✅ Klucz API zapisany!');
        }

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            console.log('File selected:', file.name);
            
            if (!apiKey) {
                showError('Najpierw ustaw klucz API!');
                return;
            }
            
            processImage(file);
        });

        function showProgress(text) {
            document.getElementById('progress').classList.remove('hidden');
            document.getElementById('progressText').textContent = text;
            document.getElementById('error').classList.add('hidden');
        }

        function hideProgress() {
            document.getElementById('progress').classList.add('hidden');
        }

        function showError(text) {
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorText').textContent = text;
            hideProgress();
        }

        async function processImage(file) {
            showProgress('📸 Wczytywanie obrazu...');

            try {
                showProgress('🔍 OCR - Rozpoznawanie tekstu...');
                
                const { data: { text } } = await Tesseract.recognize(
                    file,
                    'pol+eng',
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                const progress = Math.round(m.progress * 100);
                                showProgress(`🔍 OCR: ${progress}%`);
                            }
                        }
                    }
                );

                if (!text || text.trim().length < 10) {
                    showError('OCR nie rozpoznał tekstu. Spróbuj z lepszej jakości screenshotem.');
                    return;
                }

                console.log('=== OCR TEXT ===');
                console.log(text);
                
                showProgress('🤖 GPT-4 analizuje przepis...');
                await processWithGPT(text);

            } catch (error) {
                console.error('Error:', error);
                showError('Błąd: ' + error.message);
            }
            
            document.getElementById('imageInput').value = '';
        }

        async function processWithGPT(ocrText) {
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: [{
                            role: 'system',
                            content: 'Jesteś asystentem kulinarnym. Wyciągnij z tekstu składniki i zwróć JSON bez dodatkowego tekstu.'
                        }, {
                            role: 'user',
                            content: `Z tekstu OCR wyciągnij tytuł przepisu i składniki. Popraw błędy OCR (np. "1509" to "150g").

Tekst OCR:
${ocrText}

Zwróć TYLKO JSON:
{
  "title": "nazwa",
  "ingredients": ["składnik 1", "składnik 2"]
}

WAŻNE:
- Usuń myślniki/kropki z początku
- Każdy składnik osobno
- BEZ instrukcji, BEZ nagłówków`
                        }],
                        temperature: 0.3,
                        max_tokens: 1000
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'Błąd API');
                }

                const data = await response.json();
                const content = data.choices[0].message.content.trim();
                
                console.log('=== GPT RESPONSE ===');
                console.log(content);

                const jsonMatch = content.match(/\{[\s\S]*\}/);
                if (!jsonMatch) {
                    throw new Error('GPT nie zwrócił JSON');
                }

                const result = JSON.parse(jsonMatch[0]);

                if (!result.ingredients || result.ingredients.length === 0) {
                    showError('GPT nie znalazł składników.');
                    return;
                }

                recipes = [{
                    id: Date.now(),
                    title: result.title || 'Przepis ze screenshota',
                    ingredients: result.ingredients
                }];

                hideProgress();
                renderRecipes();

            } catch (error) {
                console.error('GPT Error:', error);
                showError('Błąd GPT: ' + error.message);
            }
        }

        function renderRecipes() {
            const container = document.getElementById('recipesList');
            document.getElementById('recipeCount').textContent = recipes.length;

            if (recipes.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-8">Brak przepisów</p>';
                return;
            }

            container.innerHTML = recipes.map(recipe => `
                <div onclick="toggleRecipe(${recipe.id})" 
                     class="p-4 rounded-xl border-2 cursor-pointer transition-all ${
                         selectedRecipes.has(recipe.id) 
                         ? 'border-purple-500 bg-purple-50 shadow-lg' 
                         : 'border-gray-200 bg-white'
                     }">
                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-gray-800 flex-1">${recipe.title}</h3>
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${
                            selectedRecipes.has(recipe.id) 
                            ? 'border-purple-500 bg-purple-500 text-white' 
                            : 'border-gray-300'
                        }">
                            ${selectedRecipes.has(recipe.id) ? '✓' : ''}
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 mt-2">📋 ${recipe.ingredients.length} składników</p>
                </div>
            `).join('');

            document.getElementById('generateBtn').disabled = selectedRecipes.size === 0;
        }

        function toggleRecipe(id) {
            if (selectedRecipes.has(id)) {
                selectedRecipes.delete(id);
            } else {
                selectedRecipes.add(id);
            }
            renderRecipes();
        }

        function generateShoppingList() {
            const ingredients = new Map();

            recipes
                .filter(r => selectedRecipes.has(r.id))
                .forEach(r => {
                    r.ingredients.forEach(ing => {
                        ingredients.set(ing, false);
                    });
                });

            shoppingList = Array.from(ingredients.keys()).map((name, i) => ({
                id: i,
                name: name,
                checked: false
            }));

            renderShoppingList();
        }

        function renderShoppingList() {
            const container = document.getElementById('shoppingList');

            if (shoppingList.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-8">Wybierz przepisy aby wygenerować listę</p>';
                return;
            }

            const unchecked = shoppingList.filter(i => !i.checked).length;

            container.innerHTML = `
                <div class="space-y-2">
                    ${shoppingList.map(item => `
                        <div class="flex items-center justify-between p-3 rounded-lg ${
                            item.checked ? 'bg-green-100 text-green-800 line-through' : 'bg-white text-gray-800'
                        } shadow-md">
                            <div class="flex items-center gap-3 flex-1">
                                <button onclick="toggleItem(${item.id})" 
                                        class="w-6 h-6 rounded border-2 flex items-center justify-center ${
                                            item.checked ? 'border-green-500 bg-green-500 text-white' : 'border-gray-400'
                                        }">
                                    ${item.checked ? '✓' : ''}
                                </button>
                                <span class="flex-1 font-medium">${item.name}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <div class="mt-4 pt-4 border-t-2 border-gray-200">
                    <p class="text-center font-bold text-gray-700">
                        🛒 ${unchecked} / ${shoppingList.length} do kupienia
                    </p>
                </div>
            `;
        }

        function toggleItem(id) {
            const item = shoppingList.find(i => i.id === id);
            if (item) {
                item.checked = !item.checked;
                renderShoppingList();
            }
        }

        function loadDemo() {
            recipes = [
                {
                    id: 1,
                    title: "Spaghetti Bolognese",
                    ingredients: ["spaghetti 500g", "mięso mielone 300g", "pomidory 400g", "cebula 1 szt", "czosnek 2 ząbki"]
                },
                {
                    id: 2,
                    title: "Kurczak curry",
                    ingredients: ["kurczak 600g", "mleko kokosowe 400ml", "pasta curry 2 łyżki", "ryż 300g"]
                }
            ];
            selectedRecipes.clear();
            renderRecipes();
        }

        renderRecipes();
    </script>
</body>
</html>
